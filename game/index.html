function shuffle(a) { var r=a.slice(); for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;} return r; }

var diseaseProductMap = {};
var productDiseaseMap = {};
(function(){
    for(var di=0;di<diseaseData.length;di++){
        var d=diseaseData[di]; var pids=[];
        for(var si=0;si<d.solutions.length;si++){

            for(var pi=0;pi<allProducts.length;pi++){
                var p=allProducts[pi]; if(pids.indexOf(p.id)>=0)continue;
                var bn=p.name.replace(/[RTDGESW]$/,'');
                if(st.indexOf(p.name)>=0||st.indexOf(bn)>=0) pids.push(p.id);
            }
        }
        diseaseProductMap[d.name]=pids;
        for(var k=0;k<pids.length;k++){
            if(!productDiseaseMap[pids[k]]) productDiseaseMap[pids[k]]=[];
            if(productDiseaseMap[pids[k]].indexOf(d.name)<0) productDiseaseMap[pids[k]].push(d.name);

})();

function genLevel0(){
    var qs=[],attempts=0;
    // 类型A：疫病→产品
    for(var i=0;i<5;i++){
        var d=diseaseData[Math.floor(Math.random()*diseaseData.length)];
        var sol=d.solutions[Math.floor(Math.random()*d.solutions.length)];
        var match=(sol.products||'').match(/^([\u4e00-\u9fa5a-zA-Z0-9]+)/);
        if(!match)continue;
        var pn=match[1],cp=null;
        for(var j=0;j<allProducts.length;j++){
            var pp=allProducts[j],bn=pp.name.replace(/[RTDGESW]$/,'');
            if(pp.name.indexOf(pn)>=0||pn.indexOf(bn)>=0){cp=pp;break;}
        }
        if(!cp)continue;
        var vids=diseaseProductMap[d.name]||[cp.id];
        var wrongs=[];for(var k=0;k<allProducts.length;k++){if(vids.indexOf(allProducts[k].id)<0)wrongs.push(allProducts[k]);}
        if(wrongs.length<3)continue;
        var wo=pick(wrongs,3);
        qs.push({type:'disease-to-product',question:'鸭场发生【'+d.name+'】'+sol.title+'，首选哪个产品？',
            hint:'参考：'+sol.products,correct:vids,productId:cp.id,
            options:shuffle([{id:cp.id,text:cp.name},{id:wo[0].id,text:wo[0].name},{id:wo[1].id,text:wo[1].name},{id:wo[2].id,text:wo[2].name}])});
    }
    // 类型B：产品→疫病
    while(qs.length<10&&attempts<60){
        attempts++;
        var prod=allProducts[Math.floor(Math.random()*allProducts.length)];
        var rd=productDiseaseMap[prod.id];
        if(!rd||rd.length===0)continue;
        var dName=rd[Math.floor(Math.random()*rd.length)];
        var wrongD=[];for(var m=0;m<diseaseData.length;m++){if(rd.indexOf(diseaseData[m].name)<0)wrongD.push(diseaseData[m].name);}
        if(wrongD.length<3)continue;
        var wd=pick(wrongD,3);
        qs.push({type:'product-to-disease',question:'【'+prod.name+'】可用于防控哪种疫病？',
            hint:prod.components||prod.highlight||'',correct:rd,productId:prod.id,
            options:shuffle([{id:dName,text:dName},{id:wd[0],text:wd[0]},{id:wd[1],text:wd[1]},{id:wd[2],text:wd[2]}])});
    }
    return shuffle(qs).slice(0,10);
}

            if(oItems.length>0){
                var fi=oItems[Math.floor(Math.random()*oItems.length)];
                analysis='这不属于【'+c.name+'】。正确：'+item.value;
                qs.push({type:'contraindication',question:'关于【'+c.name+'】，以下正确吗？\n「'+fi.value+'」',
                    hint:'',correct:['错误'],productId:0,
                    options:shuffle([{id:'正确',text:'✅ 正确'},{id:'错误',text:'❌ 错误'},{id:'视情况',text:'⚠️ 视情况'}]),analysis:analysis});
            }
        }
    }
    // 混合感染+核心产品
    var md=[];for(var di2=0;di2<diseaseData.length;di2++){if(diseaseData[di2].solutions.length>=3)md.push(diseaseData[di2]);}
    for(var mi=0;mi<md.length&&qs.length<7;mi++){
        var dd=md[mi],sol=dd.solutions[Math.floor(Math.random()*dd.solutions.length)];
        var re2=/([\u4e00-\u9fa5]{2,8}(?:R|T|D|G|E|S|W)?)/g,pn2=[],m2;
        while((m2=re2.exec(sol.products))!==null){
            var found=false;for(var fi2=0;fi2<allProducts.length;fi2++){if(allProducts[fi2].name===m2[1]){found=true;break;}}
            if(found&&pn2.indexOf(m2[1])<0)pn2.push(m2[1]);
        }
        if(pn2.length===0)continue;
        var cp3=null;for(var cpi2=0;cpi2<allProducts.length;cpi2++){if(allProducts[cpi2].name===pn2[0]){cp3=allProducts[cpi2];break;}}
        if(!cp3)continue;
        var vids2=diseaseProductMap[dd.name]||[cp3.id];
        var wrongs2=[];for(var wi=0;wi<allProducts.length;wi++){if(vids2.indexOf(allProducts[wi].id)<0)wrongs2.push(allProducts[wi]);}
        if(wrongs2.length<3)continue;
        var wo2=pick(wrongs2,3);
        qs.push({type:'mixed-infection',question:'【综合】'+dd.name+' - '+sol.title+'\n方案：'+sol.products+'\n核心产品？',
            hint:'注意联合用药',correct:vids2,productId:cp3.id,
            options:shuffle([{id:cp3.id,text:cp3.name},{id:wo2[0].id,text:wo2[0].name},{id:wo2[1].id,text:wo2[1].name},{id:wo2[2].id,text:wo2[2].name}]),
            analysis:'【'+dd.name+'】'+sol.title+'：'+sol.products});
    }
    // 核心卖点
    var hp=[];for(var hi=0;hi<allProducts.length;hi++){if(allProducts[hi].highlight)hp.push(allProducts[hi]);}
    hp=shuffle(hp);
    for(var hj=0;hj<hp.length&&qs.length<10;hj++){
        var p2=hp[hj],wrongs3=[];for(var wj=0;wj<allProducts.length;wj++){if(allProducts[wj].id!==p2.id&&allProducts[wj].highlight)wrongs3.push(allProducts[wj]);}
        if(wrongs3.length<3)continue;
        var wo3=pick(wrongs3,3);
        var hl=p2.highlight.length>30?p2.highlight.substring(0,30)+'…':p2.highlight;
        qs.push({type:'highlight',question:'哪个产品核心卖点：\n「'+hl+'」？',hint:'',correct:[p2.id],productId:p2.id,
            options:shuffle([{id:p2.id,text:p2.name},{id:wo3[0].id,text:wo3[0].name},{id:wo3[1].id,text:wo3[1].name},{id:wo3[2].id,text:wo3[2].name}])});
    }
    return shuffle(qs).slice(0,10);
}

// === UI ===
function show(id){
    var el=document.getElementById(id);
    if(!el)return;
    el.classList.remove('hidden');
}
function hide(id){
    var el=document.getElementById(id);
    if(!el)return;
    el.classList.add('hidden');
}

function renderDiffCards(){
    var h='';
    for(var i=0;i<LEVELS.length;i++){
        var lv=LEVELS[i],lk=lv.unlocked?'':' locked';
        h+='<div class="diff-card'+lk+'" data-level="'+lv.id+'">';
        h+='<div class="diff-icon">'+lv.icon+'</div><div class="diff-name">'+lv.name+'</div><div class="diff-desc">'+lv.desc+'</div>';
        if(!lv.unlocked)h+='<div class="diff-lock">🔒</div>';
        h+='</div>';
    }
    document.getElementById('diffCards').innerHTML=h;
}

function renderQuestion(){
    var lv=LEVELS[GS.level],q=GS.questions[GS.qIdx];
    if(!q){dbg('题目不存在 idx='+GS.qIdx);return;}
    document.getElementById('levelProgress').textContent='第 '+(GS.qIdx+1)+'/'+lv.questions+' 题';
    document.getElementById('progressFill').style.width=((GS.qIdx/lv.questions)*100)+'%';
    var tl={'disease-to-product':'🦆 产品匹配','product-to-disease':'🦆 产品匹配','components':'📋 成分规格',
        'specs':'📋 成分规格','water-mix':'💉 用量实操','course':'💉 用量实操',
        'contraindication':'🎯 综合实战','mixed-infection':'🎯 综合实战','highlight':'🎯 综合实战'};
    var h='<div class="question-card">';
    h+='<div class="question-type">'+(tl[q.type]||'答题')+'</div>';
    h+='<div class="question-text">'+escHtml(q.question).replace(/\n/g,'<br>')+'</div>';
    if(q.hint)h+='<div class="question-hint">💡 '+escHtml(q.hint)+'</div>';
    h+='</div><div class="options" id="optWrap">';
    for(var i=0;i<q.options.length;i++){
        h+='<button class="option-btn" data-opt-idx="'+i+'"><span class="option-letter">'+String.fromCharCode(65+i)+'</span> '+escHtml(q.options[i].text)+'</button>';
    }
    h+='</div><div id="feedbackArea"></div>';
    document.getElementById('questionArea').innerHTML=h;
    GS.answered=false;
}

function buildCard(p,dosInfo){
    if(!p)return '';
    var tl=p.type==='vaccine'?'💉疫苗':p.type==='antibody'?'🛡️抗体':p.type==='drug'?'💊药品':'📦其他';
    var h='<div class="product-mini-card">';
    h+='<div class="pmc-name">'+escHtml(p.name)+' <span class="pmc-type">'+tl+'</span></div>';
    h+='<div class="pmc-row"><span>通用名</span><span>'+escHtml(p.genericName||'-')+'</span></div>';
    h+='<div class="pmc-row"><span>成分</span><span>'+escHtml(p.components||'-')+'</span></div>';
    h+='<div class="pmc-row"><span>规格</span><span>'+escHtml(p.specs||'-')+'</span></div>';
    h+='<div class="pmc-row"><span>用法</span><span>'+escHtml(p.usage||'-')+'</span></div>';
    if(dosInfo){
        var wm=dosInfo.waterMix||'-',cd=dosInfo.courseDays?dosInfo.courseDays+'天':'-';
        h+='<div class="pmc-row"><span>兑水</span><span>'+escHtml(wm)+'</span></div>';
        h+='<div class="pmc-row"><span>疗程</span><span>'+escHtml(cd)+'</span></div>';
    }
    if(p.immunity)h+='<div class="pmc-row"><span>免疫期</span><span>'+escHtml(p.immunity)+'</span></div>';
    if(p.highlight)h+='<div class="pmc-row pmc-highlight"><span>亮点</span><span>'+escHtml(p.highlight)+'</span></div>';
    h+='</div>';return h;
}

function renderFeedback(isCorrect,q){
    var area=document.getElementById('feedbackArea');
    if(!area){dbg('feedbackArea不存在');return;}
    var analysis='',cardHtml='';
    if(q.type==='disease-to-product'){
        var names=[],cids=q.correct;
        for(var i=0;i<cids.length;i++){var pp=productMap[cids[i]];names.push(pp?pp.name:String(cids[i]));}
        analysis='💡 治疗该疫病可选：<strong>'+names.join('、')+'</strong>';
        var mp=productMap[cids[0]];if(mp)cardHtml=buildCard(mp);
    } else if(q.type==='product-to-disease'){
        var p=productMap[q.productId];
        if(p){analysis='💡 <strong>'+p.name+'</strong>可用于防控：<strong>'+q.correct.join('、')+'</strong>';cardHtml=buildCard(p);}
    } else if(q.type==='components'){
        var p2=productMap[q.productId];if(p2){analysis='💡 <strong>'+p2.name+'</strong>成分：'+(p2.components||'详见说明');cardHtml=buildCard(p2);}
    } else if(q.type==='water-mix'){
        var p3=productMap[q.productId];
        if(p3){var di=productDosage[p3.id],wm=di?(di.waterMix||'详见说明'):'详见说明';analysis='💡 <strong>'+p3.name+'</strong>兑水：'+wm;cardHtml=buildCard(p3,di);}
    } else if(q.type==='course'){
        var p4=productMap[q.productId];
        if(p4){var di2=productDosage[p4.id],cd=di2?(di2.courseDays?di2.courseDays+'天':'详见说明'):'详见说明';analysis='💡 <strong>'+p4.name+'</strong>疗程：'+cd;cardHtml=buildCard(p4,di2);}
    } else if(q.type==='contraindication'||q.type==='mixed-infection'){
        analysis='💡 '+(q.analysis||'详见产品说明');
    } else if(q.type==='highlight'){
        var p5=productMap[q.productId];if(p5){analysis='💡 <strong>'+p5.name+'</strong>卖点：'+(p5.highlight||'详见说明');cardHtml=buildCard(p5);}
    } else {
        var names2=[];for(var fi=0;fi<q.correct.length;fi++){var fpp=productMap[q.correct[fi]];names2.push(fpp?fpp.name:String(q.correct[fi]));}
        analysis='💡 正确答案：<strong>'+names2.join('、')+'</strong>';
    }
    var lv=LEVELS[GS.level],pts=lv.baseScore;
    if(GS.combo>=5)pts=pts*2;else if(GS.combo>=3)pts=Math.floor(pts*1.5);
    var h='<div class="feedback '+(isCorrect?'correct':'wrong')+'">';
    h+='<div class="feedback-header"><span class="feedback-icon">'+(isCorrect?'✅':'❌')+'</span>';
    h+='<span class="feedback-title">'+(isCorrect?'回答正确！':'回答错误')+'</span>';
    if(isCorrect)h+='<span class="feedback-points">+'+pts+'</span>';
    h+='</div><div class="feedback-analysis"><p class="analysis-text">'+analysis+'</p></div>';
    if(cardHtml)h+='<div class="feedback-product-card">'+cardHtml+'</div>';
    var isLast=(GS.qIdx>=lv.questions-1);
    h+='<button class="next-btn" id="btnNextQ">'+(isLast?'查看结果':'下一题 →')+'</button></div>';
    area.innerHTML=h;
}

// === 核心逻辑 ===
function selectOption(idx){
    try {
        if(GS.answered)return;
        GS.answered=true;
        var q=GS.questions[GS.qIdx];
        if(!q){dbg('题目不存在');GS.answered=false;return;}
        var opt=q.options[idx];
        if(!opt){dbg('选项不存在 idx='+idx);GS.answered=false;return;}
        var optId=opt.id,optText=opt.text,correctArr=q.correct,isCorrect=false;
        // 判断正确性
        if(correctArr.length>0 && typeof correctArr[0]==='number'){
            for(var i=0;i<correctArr.length;i++){if(correctArr[i]===Number(optId)){isCorrect=true;break;}}
        } else {
            for(var j=0;j<correctArr.length;j++){if(correctArr[j]===optId||optText.indexOf(correctArr[j])>=0){isCorrect=true;break;}}
        }
        // 视觉
        var btns=document.querySelectorAll('#optWrap .option-btn');
        if(btns[idx])btns[idx].classList.add(isCorrect?'correct':'wrong');
        if(!isCorrect){
            for(var k=0;k<q.options.length;k++){
                var o=q.options[k],isCO=false;
                if(typeof correctArr[0]==='number'){for(var m=0;m<correctArr.length;m++){if(correctArr[m]===Number(o.id)){isCO=true;break;}}}
                else{for(var n=0;n<correctArr.length;n++){if(correctArr[n]===o.id||o.text.indexOf(correctArr[n])>=0){isCO=true;break;}}}
                if(isCO&&btns[k])btns[k].classList.add('correct');
            }
            GS.lives--;GS.combo=0;
        } else {
            GS.combo++;GS.levelCorrect++;
            var pts=LEVELS[GS.level].baseScore;
            if(GS.combo>=5)pts=pts*2;else if(GS.combo>=3)pts=Math.floor(pts*1.5);
            GS.score+=pts;GS.levelScore+=pts;
        }
        updateScore();updateLives();updateCombo();
        renderFeedback(isCorrect,q);
    } catch(e){dbg('selectOption错误: '+e.message);GS.answered=false;}
}

function nextQuestion(){
    var lv=LEVELS[GS.level];GS.qIdx++;
    if(GS.qIdx>=lv.questions)showLevelComplete();
    else renderQuestion();
}

function showLevelComplete(){
    hide('gameScreen');show('levelComplete');
    var lv=LEVELS[GS.level],total=lv.questions,pct=Math.round((GS.levelCorrect/total)*100);
    GS.levelResults[lv.id]={correct:GS.levelCorrect,total:total,score:GS.levelScore};
    document.getElementById('lcIcon').textContent=pct>=80?'🎉':pct>=60?'👍':'😅';
    document.getElementById('lcTitle').textContent=pct>=60?'关卡通过！':'继续努力！';
    document.getElementById('lcStats').innerHTML='<div>正确率 '+pct+'%（'+GS.levelCorrect+'/'+total+'）</div><div>本关 '+GS.levelScore+'分 | 总分 '+GS.score+'</div>';
    if(pct>=60&&GS.level<LEVELS.length-1){LEVELS[GS.level+1].unlocked=true;document.getElementById('btnNextLevel').style.display='';}
    else{document.getElementById('btnNextLevel').style.display='none';}
    saveProgress();
}

function startLevel(levelId){
    GS.level=levelId;GS.qIdx=0;GS.combo=0;GS.lives=3;GS.levelCorrect=0;GS.levelScore=0;GS.answered=false;
    switch(levelId){case 0:GS.questions=genLevel0();break;case 1:GS.questions=genLevel1();break;case 2:GS.questions=genLevel2();break;case 3:GS.questions=genLevel3();break;}
    while(GS.questions.length<LEVELS[levelId].questions){
        var fb=allProducts[Math.floor(Math.random()*allProducts.length)];
        var ws=[];for(var i=0;i<allProducts.length;i++){if(allProducts[i].id!==fb.id)ws.push(allProducts[i]);}
        if(ws.length<3)continue;var wo=pick(ws,3);
        GS.questions.push({type:'components',question:'【'+fb.name+'】属于哪类产品？',hint:'',correct:[fb.id],productId:fb.id,
            options:shuffle([{id:fb.id,text:fb.name},{id:wo[0].id,text:wo[0].name},{id:wo[1].id,text:wo[1].name},{id:wo[2].id,text:wo[2].name}])});
    }
    hide('levelSelect');show('gameScreen');
    document.getElementById('levelIcon').textContent=LEVELS[levelId].icon;
    document.getElementById('levelTitle').textContent=LEVELS[levelId].name;
    updateScore();updateLives();updateCombo();renderQuestion();
}

function updateScore(){document.getElementById('scoreDisplay').textContent=GS.score+'分';}
function updateLives(){
    var s='';for(var i=0;i<GS.lives;i++)s+='❤️';for(var j=GS.lives;j<3;j++)s+='🖤';
    document.getElementById('livesDisplay').textContent=s;
}
function updateCombo(){
    var el=document.getElementById('comboDisplay');
    if(GS.combo>=3){el.textContent='🔥 '+GS.combo+'连击！';el.classList.add('active');}
    else{el.textContent='';el.classList.remove('active');}
}


// === 进度存档 ===
function saveProgress(){
    try{
        var data={unlocked:[],score:GS.score,level:GS.level,levelResults:GS.levelResults};
        for(var i=0;i<LEVELS.length;i++) data.unlocked.push(LEVELS[i].unlocked);
        localStorage.setItem('wq_game_progress',JSON.stringify(data));
    }catch(e){}
}
function loadProgress(){
    try{
        var raw=localStorage.getItem('wq_game_progress');
        if(!raw)return false;
        var data=JSON.parse(raw);
        if(data.unlocked){
            for(var i=0;i<data.unlocked.length&&i<LEVELS.length;i++) LEVELS[i].unlocked=data.unlocked[i];
        }
        if(data.score) GS.score=data.score;
        if(data.levelResults) GS.levelResults=data.levelResults;
        return !!data.unlocked;
    }catch(e){return false;}
}
function clearProgress(){
    localStorage.removeItem('wq_game_progress');
    for(var i=0;i<LEVELS.length;i++) LEVELS[i].unlocked=(i===0);
    GS.score=0;GS.levelResults={};
}
function hasProgress(){try{return !!localStorage.getItem('wq_game_progress');}catch(e){return false;}}

// === 排行榜（Supabase云+本地缓存） ===
var SB_URL='https://tnkqrgqdjvriuaohyszf.supabase.co';
var SB_KEY='sb_publishable_9XkEHTdA6GqyhM2xLDeK7A_WIvDj7vF';

function getLB(){try{return JSON.parse(localStorage.getItem('wq_game_lb')||'[]');}catch(e){return [];}}
function saveLBLocal(name,score,level,correct,total){
    var lb=getLB();lb.push({name:name,score:score,level:level,correct:correct,total:total,date:new Date().toLocaleDateString()});
    lb.sort(function(a,b){return b.score-a.score;});lb=lb.slice(0,50);
    localStorage.setItem('wq_game_lb',JSON.stringify(lb));
}

// 保存到Supabase云端
function saveLBCloud(name,score,level,correct,total){
    saveLBLocal(name,score,level,correct,total);
    try{
        fetch(SB_URL+'/rest/v1/game_leaderboard',{
            method:'POST',
            headers:{'apikey':SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
            body:JSON.stringify({name:name,score:score,level:level,correct:correct,total:total})
        }).catch(function(){});
    }catch(e){}
}

// 从Supabase云端加载
function loadLBCloud(callback){
    try{
        fetch(SB_URL+'/rest/v1/game_leaderboard?select=name,score,level,correct,total,created_at&order=score.desc&limit=50',{
            headers:{'apikey':SB_KEY}
        }).then(function(r){return r.json();}).then(function(data){
            if(Array.isArray(data)&&data.length>0){
                var merged=data.map(function(d){
                    return {name:d.name,score:d.score,level:d.level||'',correct:d.correct||0,total:d.total||10,date:d.created_at?d.created_at.substring(0,10):''};
                });
                callback(merged);
            }else{
                callback(getLB());
            }
        }).catch(function(){callback(getLB());});
    }catch(e){callback(getLB());}
}

function saveLB(name,score,level,correct,total){saveLBCloud(name,score,level,correct,total);}

function renderLB(){
    document.getElementById('lbList').innerHTML='<div style="color:#8b949e;text-align:center;padding:20px;">加载中...</div>';

        var h='';
        if(lb.length===0){h='<div style="color:#8b949e;text-align:center;padding:20px;">暂无记录</div>';}
        else{for(var i=0;i<lb.length;i++){var e=lb[i],medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
            h+='<div style="display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid #30363d;">';
            h+='<span style="width:36px;font-size:18px;">'+medal+'</span><span style="flex:1;font-size:14px;">'+escHtml(e.name)+'</span>';
            h+='<span style="font-size:14px;color:#f39c12;font-weight:600;">'+e.score+'分</span>';
            var lvInfo=e.level?' ('+e.level+')':'';
            h+='<span style="font-size:12px;color:#8b949e;margin-left:8px;">'+e.correct+'/'+e.total+lvInfo+'</span></div>';}}
        document.getElementById('lbList').innerHTML=h;
    });
}

// === 事件绑定（全部用事件委托，无inline onclick） ===
document.addEventListener('DOMContentLoaded',function(){
    renderDiffCards();
    // 检查存档，显示继续挑战按钮
    if(hasProgress()){
        document.getElementById('btnContinue').classList.remove('hidden');
    }
    document.getElementById('btnStart').addEventListener('click',function(){clearProgress();renderDiffCards();hide('startScreen');show('levelSelect');});
    document.getElementById('btnContinue').addEventListener('click',function(){loadProgress();renderDiffCards();hide('startScreen');show('levelSelect');});
    document.getElementById('btnLbHome').addEventListener('click',function(){renderLB();show('lbModal');});
    document.getElementById('btnCloseLb').addEventListener('click',function(){hide('lbModal');});
    document.getElementById('diffCards').addEventListener('click',function(e){
        var card=e.target.closest('.diff-card');if(!card||card.classList.contains('locked'))return;
        startLevel(parseInt(card.getAttribute('data-level')));
    });
    document.getElementById('btnExit').addEventListener('click',function(){if(confirm('确定退出？')){saveProgress();hide('gameScreen');show('levelSelect');renderDiffCards();}});
    document.getElementById('btnBackHome').addEventListener('click',function(){saveProgress();if(hasProgress())document.getElementById('btnContinue').classList.remove('hidden');hide('levelSelect');show('startScreen');});
    // 核心修复：选项点击用事件委托
    document.getElementById('questionArea').addEventListener('click',function(e){
        var btn=e.target.closest('.option-btn');
        if(btn&&!GS.answered){var idx=parseInt(btn.getAttribute('data-opt-idx'));if(!isNaN(idx))selectOption(idx);}
    });
    // 下一题按钮也用事件委托
    document.getElementById('questionArea').addEventListener('click',function(e){
        if(e.target&&e.target.id==='btnNextQ')nextQuestion();
    });
    document.getElementById('btnNextLevel').addEventListener('click',function(){hide('levelComplete');startLevel(GS.level+1);});
    document.getElementById('btnRetry').addEventListener('click',function(){hide('levelComplete');startLevel(GS.level);});
    document.getElementById('btnRetryGO').addEventListener('click',function(){hide('gameOver');startLevel(GS.level);});
    document.getElementById('btnHomeGO').addEventListener('click',function(){saveProgress();hide('gameOver');if(hasProgress())document.getElementById('btnContinue').classList.remove('hidden');show('startScreen');renderDiffCards();});
    document.getElementById('btnPlayAgain').addEventListener('click',function(){hide('victoryScreen');show('nameModal');});
    document.getElementById('btnHomeV').addEventListener('click',function(){hide('victoryScreen');show('nameModal');});
    document.getElementById('btnSaveName').addEventListener('click',function(){
        var name=document.getElementById('nameInput').value.trim()||'匿名';
        var lvName='';
        for(var i=0;i<LEVELS.length;i++){if(LEVELS[i].unlocked)lvName=LEVELS[i].name;}
        saveLB(name,GS.score,lvName,GS.levelCorrect,LEVELS[GS.level]?LEVELS[GS.level].questions:10);
        hide('nameModal');if(hasProgress())document.getElementById('btnContinue').classList.remove('hidden');show('startScreen');renderDiffCards();
    });
    // 关卡完成时记录成绩
    document.getElementById('btnSaveLC').addEventListener('click',function(){
        document.getElementById('nameInput').value='';
        show('nameModal');
    });
    // 失败时记录成绩
    document.getElementById('btnSaveGO').addEventListener('click',function(){
        document.getElementById('nameInput').value='';
        show('nameModal');
    });
});
